services:
  claude:
    annotations:
      run.oci.handler: krun
      krun.ram_mib: "4096" # At least 4096
      krun.cpus: "4" # At least 4
    user: "${HOST_UID}:${HOST_GID}"
    userns_mode: keep-id  # optional, for rootless host
    image: localhost/claude-sandbox:latest  # one image, shared by all projects
    build:
      context: .  # the folder holding this file, not the project
      args:
        HOST_UID: "${HOST_UID}"  # use UID and GID from the host so that files created in the container have correct permissions
        HOST_GID: "${HOST_GID}"
    volumes:
      # Mount the project at its host path, so Claude keeps memory, history and
      # settings per project (it keys them by path in ~/.claude/projects/).
      - ${PROJECT_DIR:?set PROJECT_DIR to the absolute project path}:${PROJECT_DIR}:z
      # Read-only, so the agent cannot commit or plant hooks that run on the host.
      # The project must have a .git, or podman-compose creates an empty one.
      - ${PROJECT_DIR}/.git:${PROJECT_DIR}/.git:ro,z
      - claude-config:/home/appuser/.claude:U,z  # persistent claude credentials/config
      # The container's own .venv, in a volume per project. It hides the host's
      # .venv, so the agent cannot change it and the host never runs what the
      # agent installs. If the host has no .venv, an empty one is created as the
      # mount point.
      - venv:${PROJECT_DIR}/.venv:U,z
      - uv:/uv:U,z  # uv's cache and Python installs, shared by all projects
    working_dir: ${PROJECT_DIR}
    stdin_open: true
    tty: true
    environment:
      - CLAUDE_CONFIG_DIR=/home/appuser/.claude
      - UV_CACHE_DIR=/uv/cache
      - UV_PYTHON_INSTALL_DIR=/uv/python  # kept, so .venv links to Pythons uv downloaded stay valid
      - UV_LINK_MODE=copy  # the cache and .venv are on different volumes
      - POETRY_VIRTUALENVS_IN_PROJECT=true  # poetry uses .venv too (uv and pdm do by default)
      - TERM=xterm-256color
      - COLORTERM=truecolor
    security_opt:
      - no-new-privileges:true

volumes:
  venv:
    name: ${VENV_VOLUME:?set VENV_VOLUME to a volume name for this project}
  uv:
    name: claude-sandbox-uv
  claude-config:
    external: true  # shared by all projects; claude-sandbox.sh creates it if missing
    name: claude-config
